  <rect x="270" y="60" width="200" height="30" fill="url(#headerGrad)" stroke="#333" stroke-width="1" rx="5"/>
  <text x="370" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Vangerven (fMRI)</text>
  
  <rect x="490" y="60" width="200" height="30" fill="url(#headerGrad)" stroke="#333" stroke-width="1" rx="5"/>
  <text x="590" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">MindBigData (EEG→fMRI)</text>
  
  <rect x="710" y="60" width="200" height="30" fill="url(#headerGrad)" stroke="#333" stroke-width="1" rx="5"/>
  <text x="810" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Crell (EEG→fMRI)</text>
  
