  <text x="150" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">MSE: 0.014</text>
  <text x="150" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">BEST</text>
  <text x="150" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Adaptive</text>
  
  <rect x="295" y="510" width="150" height="40" fill="#9013FE" stroke="#333" stroke-width="2" rx="3"/>
  <text x="370" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">MSE: 0.037</text>
  <text x="370" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">BEST</text>
  <text x="370" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Intelligence</text>
  
  <rect x="515" y="510" width="150" height="40" fill="#9013FE" stroke="#333" stroke-width="2" rx="3"/>
  <text x="590" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">MSE: 0.028</text>
  <text x="590" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">BEST</text>
  <text x="590" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Cross-modal</text>
  
  <rect x="735" y="510" width="150" height="40" fill="#9013FE" stroke="#333" stroke-width="2" rx="3"/>
  <text x="810" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">MSE: 0.022</text>
  <text x="810" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">BEST</text>
  <text x="810" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Overall</text>
  
  <!-- Performance Summary -->
  <rect x="50" y="580" width="900" height="180" fill="#f8f9fa" stroke="#333" stroke-width="2" rx="10"/>
  <text x="500" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Framework CortexFlow Performance Summary
  </text>
  
  <!-- Dataset Performance -->
  <text x="70" y="635" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Dataset Performance Analysis:</text>
  
  <text x="70" y="655" font-family="Arial, sans-serif" font-size="10" fill="#333">• Miyawaki (fMRI): Excellent performance across all variants, CortexFlow-Unified achieves best MSE (0.014)</text>
  <text x="70" y="670" font-family="Arial, sans-serif" font-size="10" fill="#333">• Vangerven (fMRI): Consistent performance, CortexFlow-Unified matches CortexFlow-Simple efficiency</text>
  <text x="70" y="685" font-family="Arial, sans-serif" font-size="10" fill="#333">• MindBigData (EEG→fMRI): Superior cross-modal adaptation, CortexFlow-Unified shows 50% improvement</text>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="10" fill="#333">• Crell (EEG→fMRI): Outstanding cross-modal robustness, CortexFlow-Unified achieves best overall performance</text>
  
  <text x="70" y="725" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Framework Innovations Demonstrated:</text>
  
  <text x="70" y="745" font-family="Arial, sans-serif" font-size="10" fill="#333">✓ Adaptive Intelligence: CortexFlow-Unified dynamically optimizes complexity for each dataset</text>
  <text x="500" y="745" font-family="Arial, sans-serif" font-size="10" fill="#333">✓ Cross-Modal Robustness: Excellent performance on EEG-translated data</text>
  <text x="70" y="755" font-family="Arial, sans-serif" font-size="10" fill="#333">✓ Systematic Uncertainty: CortexFlow-MC provides reliable confidence estimates</text>
  <text x="500" y="755" font-family="Arial, sans-serif" font-size="10" fill="#333">✓ Unified Ecosystem: Consistent performance across all variants</text>
</svg>
