  <text x="590" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">MSE: 0.126</text>
  <text x="590" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Complex</text>
  <text x="590" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Processing</text>
  
  <rect x="735" y="410" width="150" height="40" fill="url(#reconstructionGrad)" stroke="#333" stroke-width="1" rx="3"/>
  <text x="810" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">MSE: 0.126</text>
  <text x="810" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Hierarchical</text>
  <text x="810" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Analysis</text>
  
