  <text x="590" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">MSE: 0.057</text>
  <text x="590" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">+ Uncertainty</text>
  <text x="590" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">σ = 0.045</text>
  
