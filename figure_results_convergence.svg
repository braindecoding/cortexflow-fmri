<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="simpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA517;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="enhancedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1890B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="unifiedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9013FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Kerangka Kerja CortexFlow: Analisis Konvergensi Training
  </text>
  
  <!-- Chart Area -->
  <rect x="80" y="70" width="750" height="400" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis -->
  <line x1="80" y1="70" x2="80" y2="470" stroke="#333" stroke-width="2"/>
  <text x="30" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" transform="rotate(-90 30 270)">Training Loss</text>
  
  <!-- Y-axis labels -->
  <text x="70" y="75" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.15</text>
  <text x="70" y="150" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.12</text>
  <text x="70" y="225" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.09</text>
  <text x="70" y="300" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.06</text>
  <text x="70" y="375" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.03</text>
  <text x="70" y="450" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.00</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="150" x2="830" y2="150" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="225" x2="830" y2="225" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="300" x2="830" y2="300" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="375" x2="830" y2="375" stroke="#ddd" stroke-width="1"/>
  
  <!-- X-axis -->
  <line x1="80" y1="470" x2="830" y2="470" stroke="#333" stroke-width="2"/>
  <text x="455" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Epochs</text>
  
  <!-- X-axis labels -->
  <text x="130" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">20</text>
  <text x="230" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">40</text>
  <text x="330" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">60</text>
  <text x="430" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">80</text>
  <text x="530" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">100</text>
  <text x="630" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">120</text>
  <text x="730" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">140</text>
  <text x="830" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">160</text>
  
  <!-- Convergence curves -->
  <!-- CortexFlow-Simple: Fast convergence, reaches 0.020 at ~53 epochs -->
  <polyline points="80,150 130,200 180,250 230,300 280,350 330,380 380,400 430,410 480,415 530,418 580,420 630,420 680,420 730,420 780,420 830,420" 
            fill="none" stroke="url(#simpleGrad)" stroke-width="3"/>
  
  <!-- CortexFlow-MC: Similar to Simple but slightly slower -->
  <polyline points="80,140 130,190 180,240 230,290 280,340 330,370 380,390 430,405 480,412 530,416 580,418 630,419 680,419 730,419 780,419 830,419" 
            fill="none" stroke="url(#mcGrad)" stroke-width="3"/>
  
  <!-- CortexFlow-Enhanced: Slower convergence, more epochs needed -->
  <polyline points="80,120 130,160 180,200 230,240 280,280 330,320 380,350 430,370 480,385 530,395 580,402 630,407 680,410 730,412 780,413 830,414" 
            fill="none" stroke="url(#enhancedGrad)" stroke-width="3"/>
  
  <!-- CortexFlow-Unified: Adaptive convergence, best final performance -->
  <polyline points="80,130 130,180 180,230 230,280 280,330 330,360 380,385 430,400 480,408 530,412 580,414 630,415 680,415 730,415 780,415 830,415" 
            fill="none" stroke="url(#unifiedGrad)" stroke-width="4"/>
  
  <!-- Early stopping markers -->
  <circle cx="330" cy="380" r="5" fill="url(#simpleGrad)" stroke="#333" stroke-width="2"/>
  <text x="340" y="375" font-family="Arial, sans-serif" font-size="9" fill="#333">53 epochs</text>
  
  <circle cx="380" cy="390" r="5" fill="url(#mcGrad)" stroke="#333" stroke-width="2"/>
  <text x="390" y="385" font-family="Arial, sans-serif" font-size="9" fill="#333">59 epochs</text>
  
  <circle cx="480" cy="385" r="5" fill="url(#enhancedGrad)" stroke="#333" stroke-width="2"/>
  <text x="490" y="380" font-family="Arial, sans-serif" font-size="9" fill="#333">71 epochs</text>
  
  <circle cx="430" cy="400" r="5" fill="url(#unifiedGrad)" stroke="#333" stroke-width="2"/>
  <text x="440" y="395" font-family="Arial, sans-serif" font-size="9" fill="#333">65 epochs</text>
  
  <!-- Performance indicators -->
  <rect x="600" y="100" width="200" height="120" fill="#f8f9fa" stroke="#333" stroke-width="1" rx="5"/>
  <text x="700" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Final Performance</text>
  
  <text x="620" y="140" font-family="Arial, sans-serif" font-size="10" fill="#333">CortexFlow-Simple: 0.020</text>
  <text x="620" y="155" font-family="Arial, sans-serif" font-size="10" fill="#333">CortexFlow-MC: 0.016</text>
  <text x="620" y="170" font-family="Arial, sans-serif" font-size="10" fill="#333">CortexFlow-Enhanced: 0.072</text>
  <text x="620" y="185" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">CortexFlow-Unified: 0.014</text>
  
  <text x="620" y="205" font-family="Arial, sans-serif" font-size="9" fill="#666">Miyawaki Dataset</text>
  
  <!-- Legend -->
  <rect x="100" y="520" width="600" height="60" fill="#f8f9fa" stroke="#333" stroke-width="1" rx="5"/>
  <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Varian Kerangka Kerja CortexFlow</text>
  
  <line x1="120" y1="555" x2="140" y2="555" stroke="url(#simpleGrad)" stroke-width="3"/>
  <text x="150" y="560" font-family="Arial, sans-serif" font-size="10" fill="#333">CortexFlow-Simple</text>
  
  <line x1="270" y1="555" x2="290" y2="555" stroke="url(#mcGrad)" stroke-width="3"/>
  <text x="300" y="560" font-family="Arial, sans-serif" font-size="10" fill="#333">CortexFlow-MC</text>
  
  <line x1="420" y1="555" x2="440" y2="555" stroke="url(#enhancedGrad)" stroke-width="3"/>
  <text x="450" y="560" font-family="Arial, sans-serif" font-size="10" fill="#333">CortexFlow-Enhanced</text>
  
  <line x1="580" y1="555" x2="600" y2="555" stroke="url(#unifiedGrad)" stroke-width="4"/>
  <text x="610" y="560" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">CortexFlow-Unified</text>
</svg>
