<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="endGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    CortexFlow Training Protocol
  </text>
  
  <!-- Start -->
  <ellipse cx="300" cy="70" rx="80" ry="25" fill="url(#startGrad)" stroke="#333" stroke-width="2"/>
  <text x="300" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">START</text>
  
  <!-- Data Loading -->
  <rect x="220" y="120" width="160" height="40" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="300" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Load Dataset</text>
  <text x="300" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Miyawaki/Vangerven/MindBigData/Crell</text>
  
  <!-- Data Preprocessing -->
  <rect x="220" y="190" width="160" height="50" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="300" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Data Preprocessing</text>
  <text x="300" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Z-score normalization</text>
  <text x="300" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Train/Test split (80/20)</text>
  
  <!-- Model Initialization -->
  <rect x="220" y="270" width="160" height="50" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="300" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Model Initialization</text>
  <text x="300" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Architecture selection</text>
  <text x="300" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Seed = 42, Adam optimizer</text>
  
  <!-- Training Loop Start -->
  <rect x="220" y="350" width="160" height="40" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Training Loop</text>
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Epoch = 1, Max = 200</text>
  
  <!-- Forward Pass -->
  <rect x="220" y="420" width="160" height="50" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="300" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Forward Pass</text>
  <text x="300" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Batch processing</text>
  <text x="300" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Loss computation</text>
  
  <!-- Backward Pass -->
  <rect x="220" y="500" width="160" height="50" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="300" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Backward Pass</text>
  <text x="300" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Gradient computation</text>
  <text x="300" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Gradient clipping (norm=1.0)</text>
  
  <!-- Validation -->
  <rect x="220" y="580" width="160" height="40" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="300" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Validation</text>
  <text x="300" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Test set evaluation</text>
  
  <!-- Early Stopping Decision -->
  <polygon points="300 650, 350 670, 300 690, 250 670" fill="url(#decisionGrad)" stroke="#333" stroke-width="2"/>
  <text x="300" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Early</text>
  <text x="300" y="677" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Stop?</text>
  
  <!-- Best Model Decision -->
  <polygon points="450 520, 500 540, 450 560, 400 540" fill="url(#decisionGrad)" stroke="#333" stroke-width="2"/>
  <text x="450" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Best</text>
  <text x="450" y="547" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Model?</text>
  
  <!-- Save Checkpoint -->
  <rect x="520" y="520" width="120" height="40" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="580" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Save Checkpoint</text>
  <text x="580" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Best model state</text>
  
  <!-- Continue Training -->
  <rect x="50" y="650" width="120" height="40" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="110" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Continue</text>
  <text x="110" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Training</text>
  
  <!-- Final Evaluation -->
  <rect x="220" y="730" width="160" height="50" fill="url(#processGrad)" stroke="#333" stroke-width="2" rx="8"/>
  <text x="300" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Final Evaluation</text>
  <text x="300" y="762" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Load best checkpoint</text>
  <text x="300" y="772" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Test set performance</text>
  
  <!-- End -->
  <ellipse cx="300" cy="820" rx="80" ry="25" fill="url(#endGrad)" stroke="#333" stroke-width="2"/>
  <text x="300" y="825" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">END</text>
  
  <!-- Arrows -->
  <path d="M 300 95 L 300 115" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 160 L 300 185" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 240 L 300 265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 320 L 300 345" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 390 L 300 415" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 470 L 300 495" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 550 L 300 575" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 620 L 300 640" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision arrows -->
  <path d="M 380 540 L 395 540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 500 540 L 515 540" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Early stopping arrows -->
  <path d="M 250 670 L 175 670" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 690 L 300 725" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 300 780 L 300 795" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Loop back arrow -->
  <path d="M 110 650 L 110 370 L 215 370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Checkpoint loop back -->
  <path d="M 580 520 L 580 370 L 385 370" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>
  
  <!-- Labels -->
  <text x="200" y="665" font-family="Arial, sans-serif" font-size="10" fill="#333" font-weight="bold">No</text>
  <text x="320" y="710" font-family="Arial, sans-serif" font-size="10" fill="#333" font-weight="bold">Yes</text>
  <text x="420" y="535" font-family="Arial, sans-serif" font-size="9" fill="#333" font-weight="bold">Yes</text>
  <text x="420" y="570" font-family="Arial, sans-serif" font-size="9" fill="#333" font-weight="bold">No</text>
  
  <!-- Side annotations -->
  <text x="30" y="380" font-family="Arial, sans-serif" font-size="9" fill="#666">Epoch++</text>
  <text x="480" y="380" font-family="Arial, sans-serif" font-size="9" fill="#666">Save if best</text>
  
  <!-- Configuration box -->
  <rect x="420" y="120" width="160" height="180" fill="#f8f9fa" stroke="#333" stroke-width="1" rx="5"/>
  <text x="500" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Training Config</text>
  
  <text x="430" y="160" font-family="Arial, sans-serif" font-size="9" fill="#333">• LR: 1e-3</text>
  <text x="430" y="175" font-family="Arial, sans-serif" font-size="9" fill="#333">• Batch Size: 32</text>
  <text x="430" y="190" font-family="Arial, sans-serif" font-size="9" fill="#333">• Weight Decay: 1e-4</text>
  <text x="430" y="205" font-family="Arial, sans-serif" font-size="9" fill="#333">• Scheduler: ReduceLR</text>
  <text x="430" y="220" font-family="Arial, sans-serif" font-size="9" fill="#333">• Patience: 20 epochs</text>
  <text x="430" y="235" font-family="Arial, sans-serif" font-size="9" fill="#333">• Grad Clip: 1.0</text>
  <text x="430" y="250" font-family="Arial, sans-serif" font-size="9" fill="#333">• Seed: 42</text>
  <text x="430" y="265" font-family="Arial, sans-serif" font-size="9" fill="#333">• Device: CUDA</text>
  <text x="430" y="280" font-family="Arial, sans-serif" font-size="9" fill="#333">• Precision: Float32</text>
  <text x="430" y="295" font-family="Arial, sans-serif" font-size="9" fill="#333">• Max Epochs: 200</text>
</svg>
