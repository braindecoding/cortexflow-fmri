<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="fmriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="eegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1890B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="unifiedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9013FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Framework CortexFlow: Cross-Modal Robustness Analysis
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    fMRI Native vs EEG-to-fMRI Translated Performance Comparison
  </text>
  
  <!-- Main comparison chart -->
  <rect x="100" y="80" width="600" height="300" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis -->
  <line x1="100" y1="80" x2="100" y2="380" stroke="#333" stroke-width="2"/>
  <text x="50" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" transform="rotate(-90 50 230)">Test Loss (MSE)</text>
  
  <!-- Y-axis labels -->
  <text x="90" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.10</text>
  <text x="90" y="140" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.08</text>
  <text x="90" y="195" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.06</text>
  <text x="90" y="250" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.04</text>
  <text x="90" y="305" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.02</text>
  <text x="90" y="360" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.00</text>
  
  <!-- Grid lines -->
  <line x1="100" y1="140" x2="700" y2="140" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="195" x2="700" y2="195" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="250" x2="700" y2="250" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="305" x2="700" y2="305" stroke="#ddd" stroke-width="1"/>
  
  <!-- X-axis -->
  <line x1="100" y1="380" x2="700" y2="380" stroke="#333" stroke-width="2"/>
  
  <!-- Data modality sections -->
  <text x="250" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">fMRI Native</text>
  <text x="250" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(Miyawaki + Vangerven)</text>
  
  <text x="550" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">EEG→fMRI Translated</text>
  <text x="550" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(MindBigData + Crell)</text>
  
  <!-- fMRI Native Performance Bars -->
  <!-- Average of Miyawaki and Vangerven for each variant -->
  
  <!-- Simple: (0.020 + 0.038)/2 = 0.029 -> height = 305 - (0.029 * 3750) = 196.25 -->
  <rect x="180" y="271" width="30" height="109" fill="url(#fmriGrad)" stroke="#333" stroke-width="1"/>
  <text x="195" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">0.029</text>
  <text x="195" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Simple</text>
  
  <!-- MC: (0.016 + 0.040)/2 = 0.028 -> height = 305 - (0.028 * 3750) = 200 -->
  <rect x="220" y="275" width="30" height="105" fill="url(#fmriGrad)" stroke="#333" stroke-width="1"/>
  <text x="235" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">0.028</text>
  <text x="235" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">MC</text>
  
  <!-- Enhanced: (0.072 + 0.081)/2 = 0.077 -> height = 305 - (0.077 * 3750) = 16.25 -->
  <rect x="260" y="88" width="30" height="292" fill="url(#fmriGrad)" stroke="#333" stroke-width="1"/>
  <text x="275" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">0.077</text>
  <text x="275" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Enhanced</text>
  
  <!-- Unified: (0.014 + 0.037)/2 = 0.026 -> height = 305 - (0.026 * 3750) = 207.5 -->
  <rect x="300" y="283" width="30" height="97" fill="url(#unifiedGrad)" stroke="#333" stroke-width="2"/>
  <text x="315" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">0.026</text>
  <text x="315" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Unified</text>
  
  <!-- EEG→fMRI Translated Performance Bars -->
  <!-- Average of MindBigData and Crell for each variant -->
  
  <!-- Simple: (0.057 + 0.032)/2 = 0.045 -> height = 305 - (0.045 * 3750) = 136.25 -->
  <rect x="480" y="237" width="30" height="143" fill="url(#eegGrad)" stroke="#333" stroke-width="1"/>
  <text x="495" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">0.045</text>
  <text x="495" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Simple</text>
  
  <!-- MC: (0.057 + 0.052)/2 = 0.055 -> height = 305 - (0.055 * 3750) = 98.75 -->
  <rect x="520" y="199" width="30" height="181" fill="url(#eegGrad)" stroke="#333" stroke-width="1"/>
  <text x="535" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">0.055</text>
  <text x="535" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">MC</text>
  
  <!-- Enhanced: (0.126 + 0.126)/2 = 0.126 -> height = 305 - (0.126 * 3750) = -167.5, cap at 80 -->
  <rect x="560" y="85" width="30" height="295" fill="url(#eegGrad)" stroke="#333" stroke-width="1"/>
  <text x="575" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">0.126</text>
  <text x="575" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Enhanced</text>
  
  <!-- Unified: (0.028 + 0.022)/2 = 0.025 -> height = 305 - (0.025 * 3750) = 211.25 -->
  <rect x="600" y="287" width="30" height="93" fill="url(#unifiedGrad)" stroke="#333" stroke-width="2"/>
  <text x="615" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#333">0.025</text>
  <text x="615" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Unified</text>
  
  <!-- Analysis Box -->
  <rect x="50" y="450" width="700" height="130" fill="#f8f9fa" stroke="#333" stroke-width="2" rx="10"/>
  <text x="400" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">
    Cross-Modal Robustness Analysis
  </text>
  
  <!-- Key Findings -->
  <text x="70" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Key Findings:</text>
  
  <text x="70" y="520" font-family="Arial, sans-serif" font-size="10" fill="#333">
    ✓ Framework CortexFlow demonstrates exceptional cross-modal robustness across neuroimaging modalities
  </text>
  <text x="70" y="535" font-family="Arial, sans-serif" font-size="10" fill="#333">
    ✓ CortexFlow-Unified achieves consistent performance: 0.026 (fMRI) vs 0.025 (EEG→fMRI) - only 4% difference
  </text>
  <text x="70" y="550" font-family="Arial, sans-serif" font-size="10" fill="#333">
    ✓ Adaptive intelligence mechanism enables superior adaptation to cross-modal data characteristics
  </text>
  <text x="70" y="565" font-family="Arial, sans-serif" font-size="10" fill="#333">
    ✓ EEG-to-fMRI translation via NT-ViT successfully preserves neural decoding information for CortexFlow processing
  </text>
  
  <!-- Vertical separator line -->
  <line x1="400" y1="80" x2="400" y2="380" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Modality labels on chart -->
  <rect x="150" y="100" width="200" height="25" fill="url(#fmriGrad)" stroke="#333" stroke-width="1" rx="5"/>
  <text x="250" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">fMRI Native Data</text>
  
  <rect x="450" y="100" width="200" height="25" fill="url(#eegGrad)" stroke="#333" stroke-width="1" rx="5"/>
  <text x="550" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">EEG→fMRI Translated</text>
</svg>
