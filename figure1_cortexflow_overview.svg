<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for modern look -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA517;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1890B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9013FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200EA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D0021B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Framework CortexFlow: Unified Neural Decoding Ecosystem
  </text>
  
  <!-- Panel A: CortexFlow-Simple -->
  <g id="panelA">
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">A. CortexFlow-Simple (Foundation)</text>
    
    <!-- Input -->
    <rect x="50" y="80" width="80" height="40" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">fMRI Input</text>
    <text x="90" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 967)</text>
    
    <!-- Encoder -->
    <rect x="160" y="80" width="80" height="40" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="200" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Encoder</text>
    <text x="200" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">3 Layers</text>
    <text x="200" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 512)</text>
    
    <!-- Decoder -->
    <rect x="270" y="80" width="80" height="40" fill="url(#orangeGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="310" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Decoder</text>
    <text x="310" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">3 Layers</text>
    <text x="310" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 784)</text>
    
    <!-- Output -->
    <rect x="380" y="80" width="80" height="40" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="420" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Reconstruction</text>
    <text x="420" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 28×28)</text>
    
    <!-- Arrows -->
    <path d="M 130 100 L 155 100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 240 100 L 265 100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 350 100 L 375 100" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Panel B: CortexFlow-MC -->
  <g id="panelB">
    <text x="50" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">B. CortexFlow-MC (Uncertainty-Aware)</text>
    
    <!-- Input -->
    <rect x="50" y="190" width="80" height="40" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="90" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">fMRI Input</text>
    <text x="90" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 967)</text>
    
    <!-- Encoder with MC Dropout -->
    <rect x="160" y="190" width="80" height="40" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">MC Encoder</text>
    <text x="200" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Dropout 0.15</text>
    <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 512)</text>
    
    <!-- MC Sampling -->
    <rect x="270" y="170" width="80" height="25" fill="url(#purpleGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="310" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">MC Sampling</text>
    <rect x="270" y="200" width="80" height="25" fill="url(#purpleGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="310" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">10 iterations</text>
    
    <!-- Uncertainty -->
    <rect x="380" y="170" width="80" height="25" fill="url(#redGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="420" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Uncertainty</text>
    
    <!-- Reconstruction -->
    <rect x="380" y="200" width="80" height="25" fill="url(#orangeGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="420" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Reconstruction</text>
    
    <!-- Arrows -->
    <path d="M 130 210 L 155 210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 240 210 L 265 182" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 240 210 L 265 212" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 350 182 L 375 182" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 350 212 L 375 212" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Panel C: CortexFlow-Hierarchical -->
  <g id="panelC">
    <text x="50" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">C. CortexFlow-Hierarchical (Multi-Scale)</text>
    
    <!-- Input -->
    <rect x="50" y="300" width="80" height="40" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="90" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">fMRI Input</text>
    <text x="90" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 967)</text>
    
    <!-- Multi-scale Encoders -->
    <rect x="160" y="280" width="60" height="25" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="190" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Scale 1</text>
    
    <rect x="160" y="310" width="60" height="25" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="190" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Scale 2</text>
    
    <rect x="160" y="340" width="60" height="25" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="190" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Scale 4</text>
    
    <rect x="160" y="370" width="60" height="25" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="190" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Scale 8</text>
    
    <!-- Feature Fusion -->
    <rect x="250" y="320" width="80" height="40" fill="url(#purpleGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="290" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Feature</text>
    <text x="290" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Fusion</text>
    <text x="290" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 512)</text>
    
    <!-- Progressive Decoder -->
    <rect x="360" y="320" width="80" height="40" fill="url(#orangeGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="400" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Progressive</text>
    <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Decoder</text>
    <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 784)</text>
    
    <!-- Arrows -->
    <path d="M 130 320 L 155 292" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 130 320 L 155 322" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 130 320 L 155 352" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 130 320 L 155 382" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <path d="M 220 292 L 245 330" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 220 322 L 245 335" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 220 352 L 245 345" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 220 382 L 245 350" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <path d="M 330 340 L 355 340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Panel D: CortexFlow-Enhanced -->
  <g id="panelD">
    <text x="50" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">D. CortexFlow-Enhanced (Advanced Integration)</text>
    
    <!-- Input -->
    <rect x="50" y="460" width="80" height="40" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="90" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">fMRI Input</text>
    <text x="90" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 967)</text>
    
    <!-- Hierarchical + MC -->
    <rect x="160" y="440" width="80" height="30" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="200" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Hierarchical</text>
    <text x="200" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Multi-scale</text>
    
    <rect x="160" y="475" width="80" height="30" fill="url(#purpleGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="200" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">MC Dropout</text>
    <text x="200" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Uncertainty</text>
    
    <!-- Feature Alignment -->
    <rect x="270" y="440" width="80" height="30" fill="url(#redGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="310" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Feature</text>
    <text x="310" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Alignment</text>
    
    <!-- Enhanced Decoder -->
    <rect x="270" y="475" width="80" height="30" fill="url(#orangeGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="310" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Enhanced</text>
    <text x="310" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Decoder</text>
    
    <!-- Output -->
    <rect x="380" y="460" width="80" height="40" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="420" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Enhanced</text>
    <text x="420" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Output</text>
    <text x="420" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 784)</text>
    
    <!-- Arrows -->
    <path d="M 130 480 L 155 455" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 130 480 L 155 490" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 240 455 L 265 455" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 240 490 L 265 490" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 350 480 L 375 480" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Panel E: CortexFlow-Unified -->
  <g id="panelE">
    <text x="50" y="570" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">E. CortexFlow-Unified (Adaptive Intelligence)</text>
    
    <!-- Input -->
    <rect x="50" y="580" width="80" height="40" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="90" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">fMRI Input</text>
    <text x="90" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 967)</text>
    
    <!-- Complexity Predictor -->
    <rect x="160" y="560" width="80" height="25" fill="url(#redGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="200" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Complexity</text>
    <text x="200" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Predictor</text>
    
    <!-- Simple Path -->
    <rect x="160" y="590" width="80" height="25" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="200" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Simple Path</text>
    
    <!-- Complex Path -->
    <rect x="160" y="620" width="80" height="25" fill="url(#purpleGrad)" stroke="#333" stroke-width="1" rx="3"/>
    <text x="200" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Complex Path</text>
    
    <!-- Adaptive Router -->
    <rect x="270" y="590" width="80" height="40" fill="url(#orangeGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="310" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Adaptive</text>
    <text x="310" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Router</text>
    <text x="310" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">c > 0.5?</text>
    
    <!-- Output -->
    <rect x="380" y="590" width="80" height="40" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="5"/>
    <text x="420" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Unified</text>
    <text x="420" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Output</text>
    <text x="420" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">(N, 784)</text>
    
    <!-- Arrows -->
    <path d="M 130 600 L 155 572" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 130 600 L 155 602" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 130 600 L 155 632" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <path d="M 240 572 L 265 595" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 240 602 L 265 605" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    <path d="M 240 632 L 265 615" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
    
    <path d="M 350 610 L 375 610" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <text x="50" y="700" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Legend:</text>
    
    <rect x="50" y="710" width="20" height="15" fill="url(#blueGrad)" stroke="#333" stroke-width="1" rx="2"/>
    <text x="80" y="722" font-family="Arial, sans-serif" font-size="11" fill="#333">Input/Output</text>
    
    <rect x="180" y="710" width="20" height="15" fill="url(#greenGrad)" stroke="#333" stroke-width="1" rx="2"/>
    <text x="210" y="722" font-family="Arial, sans-serif" font-size="11" fill="#333">Encoder</text>
    
    <rect x="280" y="710" width="20" height="15" fill="url(#orangeGrad)" stroke="#333" stroke-width="1" rx="2"/>
    <text x="310" y="722" font-family="Arial, sans-serif" font-size="11" fill="#333">Decoder</text>
    
    <rect x="380" y="710" width="20" height="15" fill="url(#purpleGrad)" stroke="#333" stroke-width="1" rx="2"/>
    <text x="410" y="722" font-family="Arial, sans-serif" font-size="11" fill="#333">Processing</text>
    
    <rect x="500" y="710" width="20" height="15" fill="url(#redGrad)" stroke="#333" stroke-width="1" rx="2"/>
    <text x="530" y="722" font-family="Arial, sans-serif" font-size="11" fill="#333">Novel Components</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Key Features Box -->
  <g id="keyFeatures">
    <rect x="500" y="750" width="280" height="200" fill="#f8f9fa" stroke="#333" stroke-width="1" rx="5"/>
    <text x="640" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Framework CortexFlow Innovations</text>

    <text x="510" y="790" font-family="Arial, sans-serif" font-size="10" fill="#333">• Unified Ecosystem: Integrated variants</text>
    <text x="510" y="805" font-family="Arial, sans-serif" font-size="10" fill="#333">• Adaptive Intelligence: Dynamic complexity</text>
    <text x="510" y="820" font-family="Arial, sans-serif" font-size="10" fill="#333">• Systematic Uncertainty: Principled confidence</text>
    <text x="510" y="835" font-family="Arial, sans-serif" font-size="10" fill="#333">• Cross-Modal Robustness: Universal applicability</text>
    <text x="510" y="850" font-family="Arial, sans-serif" font-size="10" fill="#333">• Synergistic Integration: Coherent design</text>
    
    <text x="510" y="875" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Parameters:</text>
    <text x="510" y="890" font-family="Arial, sans-serif" font-size="9" fill="#333">Simple: 6-8M | Hierarchical: 20-29M</text>
    <text x="510" y="905" font-family="Arial, sans-serif" font-size="9" fill="#333">Enhanced: 20-29M | Unified: Variable</text>
    
    <text x="510" y="925" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Complexity:</text>
    <text x="510" y="940" font-family="Arial, sans-serif" font-size="9" fill="#333">O(n×d) → O(n×d×s) adaptive scaling</text>
  </g>
</svg>
