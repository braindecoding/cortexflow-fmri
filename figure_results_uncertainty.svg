<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="epistemicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aleatoricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="totalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9013FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Kerangka Kerja CortexFlow: Kuantifikasi Ketidakpastian
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Dekomposisi Ketidakpastian Epistemik vs Aleatorik
  </text>
  
  <!-- Chart 1: CortexFlow-MC Uncertainty -->
  <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">CortexFlow-MC</text>
  
  <rect x="50" y="100" width="300" height="200" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis for MC -->
  <line x1="50" y1="100" x2="50" y2="300" stroke="#333" stroke-width="2"/>
  <text x="20" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" transform="rotate(-90 20 200)">Uncertainty</text>
  
  <!-- Y-axis labels for MC -->
  <text x="40" y="105" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.08</text>
  <text x="40" y="150" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.06</text>
  <text x="40" y="195" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.04</text>
  <text x="40" y="240" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.02</text>
  <text x="40" y="285" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.00</text>
  
  <!-- X-axis for MC -->
  <line x1="50" y1="300" x2="350" y2="300" stroke="#333" stroke-width="2"/>
  
  <!-- Dataset labels for MC -->
  <text x="100" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Miyawaki</text>
  <text x="150" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Vangerven</text>
  <text x="250" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">MindBigData</text>
  <text x="300" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Crell</text>
  
  <!-- Uncertainty bars for CortexFlow-MC -->
  <!-- Miyawaki: Epistemic=0.024, Aleatoric=0.018 -->
  <rect x="85" y="240" width="15" height="60" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <rect x="100" y="255" width="15" height="45" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  
  <!-- Vangerven: Epistemic=0.031, Aleatoric=0.022 -->
  <rect x="135" y="222" width="15" height="78" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <rect x="150" y="245" width="15" height="55" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  
  <!-- MindBigData: Epistemic=0.045, Aleatoric=0.035 -->
  <rect x="235" y="187" width="15" height="113" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <rect x="250" y="212" width="15" height="88" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  
  <!-- Crell: Epistemic=0.042, Aleatoric=0.028 -->
  <rect x="285" y="195" width="15" height="105" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <rect x="300" y="230" width="15" height="70" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  
  <!-- Chart 2: CortexFlow-Enhanced Uncertainty -->
  <text x="600" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">CortexFlow-Enhanced</text>
  
  <rect x="450" y="100" width="300" height="200" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis for Enhanced -->
  <line x1="450" y1="100" x2="450" y2="300" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis labels for Enhanced -->
  <text x="440" y="105" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.08</text>
  <text x="440" y="150" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.06</text>
  <text x="440" y="195" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.04</text>
  <text x="440" y="240" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.02</text>
  <text x="440" y="285" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.00</text>
  
  <!-- X-axis for Enhanced -->
  <line x1="450" y1="300" x2="750" y2="300" stroke="#333" stroke-width="2"/>
  
  <!-- Dataset labels for Enhanced -->
  <text x="500" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Miyawaki</text>
  <text x="550" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Vangerven</text>
  <text x="650" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">MindBigData</text>
  <text x="700" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Crell</text>
  
  <!-- Uncertainty bars for CortexFlow-Enhanced -->
  <!-- Miyawaki: Epistemic=0.035, Aleatoric=0.025 -->
  <rect x="485" y="212" width="15" height="88" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <rect x="500" y="237" width="15" height="63" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  
  <!-- Vangerven: Epistemic=0.038, Aleatoric=0.028 -->
  <rect x="535" y="205" width="15" height="95" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <rect x="550" y="230" width="15" height="70" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  
  <!-- MindBigData: Epistemic=0.055, Aleatoric=0.042 -->
  <rect x="635" y="162" width="15" height="138" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <rect x="650" y="195" width="15" height="105" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  
  <!-- Crell: Epistemic=0.048, Aleatoric=0.035 -->
  <rect x="685" y="180" width="15" height="120" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <rect x="700" y="212" width="15" height="88" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  
  <!-- Comparison Chart: Total Uncertainty -->
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Perbandingan Total Ketidakpastian</text>
  
  <rect x="150" y="390" width="500" height="200" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis for comparison -->
  <line x1="150" y1="390" x2="150" y2="590" stroke="#333" stroke-width="2"/>
  <text x="100" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" transform="rotate(-90 100 490)">Total Uncertainty</text>
  
  <!-- Y-axis labels for comparison -->
  <text x="140" y="395" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.10</text>
  <text x="140" y="440" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.08</text>
  <text x="140" y="485" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.06</text>
  <text x="140" y="530" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.04</text>
  <text x="140" y="575" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#333">0.02</text>
  
  <!-- X-axis for comparison -->
  <line x1="150" y1="590" x2="650" y2="590" stroke="#333" stroke-width="2"/>
  
  <!-- Dataset labels for comparison -->
  <text x="250" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Miyawaki</text>
  <text x="350" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Vangerven</text>
  <text x="450" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">MindBigData</text>
  <text x="550" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Crell</text>
  
  <!-- Total uncertainty bars -->
  <!-- Miyawaki: MC=0.042, Enhanced=0.060 -->
  <rect x="230" y="548" width="20" height="42" fill="url(#totalGrad)" stroke="#333" stroke-width="1"/>
  <text x="240" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">MC</text>
  <text x="240" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.042</text>
  
  <rect x="260" y="530" width="20" height="60" fill="url(#totalGrad)" stroke="#333" stroke-width="1" opacity="0.7"/>
  <text x="270" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Enh</text>
  <text x="270" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.060</text>
  
  <!-- Vangerven: MC=0.053, Enhanced=0.066 -->
  <rect x="330" y="537" width="20" height="53" fill="url(#totalGrad)" stroke="#333" stroke-width="1"/>
  <text x="340" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.053</text>
  
  <rect x="360" y="524" width="20" height="66" fill="url(#totalGrad)" stroke="#333" stroke-width="1" opacity="0.7"/>
  <text x="370" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.066</text>
  
  <!-- MindBigData: MC=0.080, Enhanced=0.097 -->
  <rect x="430" y="510" width="20" height="80" fill="url(#totalGrad)" stroke="#333" stroke-width="1"/>
  <text x="440" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.080</text>
  
  <rect x="460" y="493" width="20" height="97" fill="url(#totalGrad)" stroke="#333" stroke-width="1" opacity="0.7"/>
  <text x="470" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.097</text>
  
  <!-- Crell: MC=0.070, Enhanced=0.083 -->
  <rect x="530" y="520" width="20" height="70" fill="url(#totalGrad)" stroke="#333" stroke-width="1"/>
  <text x="540" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.070</text>
  
  <rect x="560" y="507" width="20" height="83" fill="url(#totalGrad)" stroke="#333" stroke-width="1" opacity="0.7"/>
  <text x="570" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.083</text>
  
  <!-- Legend -->
  <rect x="50" y="630" width="700" height="60" fill="#f8f9fa" stroke="#333" stroke-width="1" rx="5"/>
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Jenis Ketidakpastian</text>
  
  <rect x="100" y="660" width="15" height="15" fill="url(#epistemicGrad)" stroke="#333" stroke-width="1"/>
  <text x="125" y="672" font-family="Arial, sans-serif" font-size="10" fill="#333">Ketidakpastian Epistemik (Model)</text>
  
  <rect x="300" y="660" width="15" height="15" fill="url(#aleatoricGrad)" stroke="#333" stroke-width="1"/>
  <text x="325" y="672" font-family="Arial, sans-serif" font-size="10" fill="#333">Ketidakpastian Aleatorik (Data)</text>
  
  <rect x="500" y="660" width="15" height="15" fill="url(#totalGrad)" stroke="#333" stroke-width="1"/>
  <text x="525" y="672" font-family="Arial, sans-serif" font-size="10" fill="#333">Total Ketidakpastian</text>
  
  <rect x="650" y="660" width="15" height="15" fill="url(#totalGrad)" stroke="#333" stroke-width="1" opacity="0.7"/>
  <text x="675" y="672" font-family="Arial, sans-serif" font-size="8" fill="#333">Enhanced</text>
</svg>
