  <text x="420" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Framework CortexFlow Variants</text>
  
  <rect x="140" y="550" width="15" height="15" fill="url(#simpleGrad)" stroke="#333" stroke-width="1"/>
  <text x="165" y="562" font-family="Arial, sans-serif" font-size="10" fill="#333">CortexFlow-Simple</text>
  
