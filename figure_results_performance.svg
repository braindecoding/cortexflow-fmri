<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for bars -->
    <linearGradient id="simpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA517;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="enhancedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D1890B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="unifiedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9013FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6200EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
    Framework CortexFlow: Comprehensive Performance Analysis
  </text>
  
  <!-- Chart Area -->
  <rect x="100" y="70" width="700" height="400" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis -->
  <line x1="100" y1="70" x2="100" y2="470" stroke="#333" stroke-width="2"/>
  <text x="50" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" transform="rotate(-90 50 270)">Test Loss (MSE)</text>
  
  <!-- Y-axis labels -->
  <text x="90" y="75" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.15</text>
  <text x="90" y="150" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.12</text>
  <text x="90" y="225" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.09</text>
  <text x="90" y="300" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.06</text>
  <text x="90" y="375" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.03</text>
  <text x="90" y="450" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#333">0.00</text>
  
  <!-- Grid lines -->
