  <line x1="100" y1="225" x2="800" y2="225" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="300" x2="800" y2="300" stroke="#ddd" stroke-width="1"/>
  <line x1="100" y1="375" x2="800" y2="375" stroke="#ddd" stroke-width="1"/>
  
  <!-- X-axis -->
  <line x1="100" y1="470" x2="800" y2="470" stroke="#333" stroke-width="2"/>
  <text x="450" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Datasets</text>
  
  <!-- Dataset groups -->
  <!-- Miyawaki -->
  <text x="200" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Miyawaki</text>
  <text x="200" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">(fMRI)</text>
  
  <!-- Vangerven -->
