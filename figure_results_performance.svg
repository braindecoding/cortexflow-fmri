  <rect x="660" y="159" width="20" height="311" fill="url(#enhancedGrad)" stroke="#333" stroke-width="1"/>
  <text x="670" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.126</text>
  
