  <text x="545" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#333">0.028</text>
  
  <!-- Bars for Crell -->
  <!-- Simple: 0.032329 -> height = 375 - (0.032329 * 2500) = 294.18 -->
  <rect x="610" y="389" width="20" height="81" fill="url(#simpleGrad)" stroke="#333" stroke-width="1"/>
  <text x="620" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.032</text>
  
  <!-- MC: 0.052272 -> height = 375 - (0.052272 * 2500) = 244.32 -->
  <rect x="635" y="339" width="20" height="131" fill="url(#mcGrad)" stroke="#333" stroke-width="1"/>
  <text x="645" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.052</text>
  
