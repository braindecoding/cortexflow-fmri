  <rect x="685" y="414" width="20" height="56" fill="url(#unifiedGrad)" stroke="#333" stroke-width="2"/>
  <text x="695" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#333">0.022</text>
  
