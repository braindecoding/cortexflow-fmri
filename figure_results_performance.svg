  <rect x="485" y="327" width="20" height="143" fill="url(#mcGrad)" stroke="#333" stroke-width="1"/>
  <text x="495" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">0.057</text>
  
